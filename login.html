<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Proud Merchant</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="pm.css">
<style>
  .box{max-width:420px;margin:40px auto 0;display:grid;gap:16px}
  .box h1{font-size:34px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .linkish{background:none;border:0;padding:0;font:inherit;color:var(--ink2);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./"><i></i>Proud Merchant</a>
    <nav class="links" aria-label="Site"><a href="pricing.html">Pricing</a><a class="cta" href="./#start">Start</a></nav>
  </header>

  <div class="box">
    <form id="loginForm" novalidate>
      <h1>Log in</h1>
      <p class="sub">New here? <a href="./#start">Start</a> instead.</p>
      <div class="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="f" style="margin-top:12px"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div style="margin-top:14px"><button class="btn brass" type="submit" id="go">Log in</button></div>
      <p class="msg" id="msg"></p>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="pm.js"></script>
<script>
(function(){
  var form = document.getElementById('loginForm'), msg = document.getElementById('msg'), go = document.getElementById('go');
  PM.session().then(function(s){ if (s) location.replace('account.html'); });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = form.email.value.trim().toLowerCase(), pw = form.password.value;
    msg.className = 'msg';
    if (!email || !pw){ msg.className = 'msg err'; msg.textContent = 'Email and password are needed.'; return; }
    go.disabled = true; msg.textContent = 'Logging in…';
    PM.signIn(email, pw).then(function(){
        // A business started before the email was confirmed is made now.
        var pending = null; try { pending = JSON.parse(localStorage.getItem('pm-pending') || 'null'); } catch(e){}
        return (pending ? PM.rpc('start_business', pending) : Promise.resolve()).then(function(){ try { localStorage.removeItem('pm-pending'); } catch(e){} location.replace('account.html'); });
      })
      .catch(function(err){ go.disabled = false; msg.className = 'msg err'; msg.textContent = /invalid/i.test(err.message) ? 'Wrong email or password.' : err.message; });
  });
})();
</script>
</body>
</html>
