<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team · Proud Merchant</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="pm.css">
<style>
  /* Ours: every business, where it stands, and the jobs its finished sections started. */
  body{font-size:16px}
  .biz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;margin-bottom:12px}
  .biz-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
  .biz h2{font-size:21px;margin:0}
  .meta{color:var(--ink2);font-size:14.5px}
  .prog{height:8px;background:var(--tint);border-radius:999px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--done)}
  .jobs{display:grid;gap:6px;margin-top:4px}
  .job{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;border-top:1px solid var(--line);padding-top:6px}
  .job small{color:var(--ink3);display:block;font-size:13px}
  .job button{font:inherit;font-size:14px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:6px 11px;cursor:pointer}
  .none{color:var(--ink3);font-size:14.5px}
  .events{font-size:14.5px;color:var(--ink2);display:grid;gap:4px}
  .events b{color:var(--ink)}
  .linkish{background:none;border:0;padding:0;font:inherit;font-size:15.5px;color:var(--ink2);text-decoration:underline;cursor:pointer}
  h1{font-size:34px;margin:10px 0 4px}
</style>
</head>
<body>
<div class="narrow">
  <header class="bar">
    <a class="brand" href="./"><i></i>Proud Merchant</a>
    <nav class="links" aria-label="Account"><span id="who" style="color:var(--ink3);font-size:14px"></span><button class="linkish" id="out" hidden>Log out</button></nav>
  </header>
  <h1>Team</h1>
  <p class="meta" id="summary"></p>
  <p class="msg err" id="err"></p>
  <div id="list"></div>
  <h2 style="font-size:22px;margin-top:28px">What happened lately</h2>
  <div class="events" id="events"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="pm.js"></script>
<script>
(function(){
  var err = document.getElementById('err');
  PM.session().then(function(s){
    if (!s){ location.replace('login.html'); return; }
    document.getElementById('who').textContent = s.user.email;
    var out = document.getElementById('out'); out.hidden = false;
    out.addEventListener('click', function(){ PM.signOut().then(function(){ location.replace('login.html'); }); });
    return load();
  }).catch(function(e){ err.textContent = e.message; });

  function load(){
    return PM.rpc('team_overview').then(function(o){
      if (!o){ err.textContent = 'This page is for the team. Your login is not on the list.'; return; }
      var list = document.getElementById('list'); list.innerHTML = '';
      var waiting = 0;
      o.businesses.forEach(function(b){ waiting += b.jobs.length; });
      document.getElementById('summary').textContent = o.businesses.length + ' business' + (o.businesses.length === 1 ? '' : 'es') + ', ' + waiting + ' job' + (waiting === 1 ? '' : 's') + ' waiting on us.';
      if (!o.businesses.length) list.appendChild(el('p', 'none', 'Nobody has started yet.'));
      o.businesses.forEach(function(b){
        var card = el('div', 'biz');
        var head = el('div', 'biz-head'); head.appendChild(el('h2', '', b.name));
        head.appendChild(el('span', 'meta', b.done + ' of ' + b.total + ' done' + (b.pending ? ', ' + b.pending + ' pending' : ''))); card.appendChild(head);
        var bar = el('div', 'prog'); var fill = el('i'); fill.style.width = (b.total ? Math.round(100 * b.done / b.total) : 0) + '%'; bar.appendChild(fill); card.appendChild(bar);
        card.appendChild(el('p', 'meta', [b.kind, b.contact, b.phone, b.email, 'started ' + when(b.started), b.last_answer ? 'last answer ' + when(b.last_answer) : ''].filter(Boolean).join(' · ')));
        var jobs = el('div', 'jobs');
        if (!b.jobs.length) jobs.appendChild(el('span', 'none', 'Nothing waiting on us.'));
        b.jobs.forEach(function(j){
          var row = el('div', 'job'); var t = el('span', '', j.kind); t.appendChild(el('small', '', 'from "' + j.section + '", ' + when(j.at))); row.appendChild(t);
          var btn = el('button', '', 'Done'); btn.addEventListener('click', function(){ btn.disabled = true; PM.rpc('job_done', { p_id: j.id }).then(load).catch(function(e){ btn.disabled = false; err.textContent = e.message; }); });
          row.appendChild(btn); jobs.appendChild(row);
        });
        card.appendChild(jobs); list.appendChild(card);
      });
      var ev = document.getElementById('events'); ev.innerHTML = '';
      o.events.forEach(function(e){
        var line = el('div'); line.appendChild(el('b', '', e.business || '')); line.appendChild(document.createTextNode((e.business ? ' · ' : '') + plain(e) + ' · ' + when(e.at))); ev.appendChild(line);
      });
    });
  }
  function plain(e){
    if (e.type === 'started') return 'started an account';
    if (e.type === 'task_done') return 'finished "' + (e.detail.section || '') + '" → ' + (e.detail.job || '');
    if (e.type === 'account_made') return 'account made by us';
    return e.type;
  }
  function when(iso){ var d = new Date(iso); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
})();
</script>
</body>
</html>
