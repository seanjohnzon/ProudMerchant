<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step · Proud Merchant</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="pm.css">
<link rel="stylesheet" href="intake.css">
<style>
  /* One step: its boxes saving as he types, or one of the two check lists. Next step at the bottom. */
  body{font-size:16px;line-height:1.45;padding-block:0 60px}
  .narrow{display:grid;gap:14px}
  header.bar{padding-block:14px}
  .crumb{color:var(--ink2);font-size:14.5px;text-decoration:none}
  h1{font-size:clamp(28px,7vw,40px);margin:0}
  .stepno{color:var(--brass);font-weight:800}
  .nextrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div class="narrow">
  <header class="bar">
    <a class="brand" href="./"><i></i>Proud Merchant</a>
    <nav class="links" aria-label="Account"><a class="crumb" href="account.html">← Your setup</a></nav>
  </header>
  <div class="top"><h1 id="title"><span class="stepno" id="no"></span> <span id="name"></span></h1><span class="progress" id="progress"></span></div>
  <p class="hint" id="hint" style="margin:0"></p>
  <p class="saving" id="saving"></p>
  <div class="empty" id="empty" hidden></div>
  <div id="sections" style="display:grid;gap:14px"></div>
  <div class="nextrow" id="nextrow"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="pm.js"></script>
<script src="intake.js"></script>
<script>
(function(){
  var saving = document.getElementById('saving'), empty = document.getElementById('empty'), el = Intake.el;
  var want = new URLSearchParams(location.search).get('s') || 's1';
  PM.session().then(function(s){
    if (!s){ location.replace('login.html'); return; }
    return PM.rpc('get_account').then(function(acct){
      if (!acct){ location.replace('account.html'); return; }
      var steps = acct.template.steps || [], i = steps.findIndex(function(x){ return x.id === want; });
      if (i < 0){ location.replace('account.html'); return; }
      var st = steps[i], bySec = {}; (acct.template.sections || []).forEach(function(x){ bySec[x.id] = x; });
      document.title = st.title + ' · ' + acct.name;
      document.getElementById('no').textContent = (i + 1) + '.'; document.getElementById('name').textContent = st.title;
      document.getElementById('hint').textContent = st.review ? '' : (st.hint || '');
      var x0 = Intake.stepState(acct, st);
      if (x0.status === 'locked'){ empty.hidden = false; empty.textContent = Intake.lockText(x0.why); nextRow(); return; }
      var host = document.getElementById('sections');
      function paintTop(){
        var x = Intake.stepState(acct, st);
        document.getElementById('progress').textContent = st.review ? (x.done + ' of ' + x.total + (st.review === 'uat' ? ' pass' : ' look good'))
          : x.status === 'done' ? 'Done' : x.status === 'pending' ? 'Pending' : x.left + ' left';
        if (!st.review && st.job && x.status === 'done') document.getElementById('hint').textContent = st.id === 's1' ? 'Done. We are putting your menu into your app; step 3 opens when it is on your phone.' : st.hint || '';
        if (st.review === 'app' && x.status === 'done') document.getElementById('hint').textContent = acct.stage === 'app_check' ? 'All good on your side. The TestFlight build is next; your list moves on when it is up.' : 'Approved. Payments and your own accounts are next.';
        if (st.review === 'uat' && x.status === 'done') document.getElementById('hint').textContent = acct.stage === 'uat_passed' ? 'Passed on both sides. Launch is next.' : 'All passed on your side. Our tester finishes the same list, then launch.';
      }
      if (st.review){
        Intake.renderReview(host, acct, st, saving, function(){ PM.rpc('get_account').then(function(a){ acct.stage = a.stage; acct.review = a.review; paintTop(); }).catch(function(){ paintTop(); }); });
      } else {
        var secs = st.sections.map(function(id){ return bySec[id]; }).filter(Boolean);
        Intake.render(host, acct, secs, saving, paintTop);
      }
      paintTop(); nextRow();
      function nextRow(){
        var row = document.getElementById('nextrow'), j = i + 1, next = null;
        while (j < steps.length){ if (Intake.stepState(acct, steps[j]).status !== 'locked'){ next = steps[j]; break; } j++; }
        if (next){ var b = el('a', 'btn brass', 'Next: ' + (steps.indexOf(next) + 1) + '. ' + next.title); b.href = 'step.html?s=' + next.id; row.appendChild(b); }
        var back = el('a', 'crumb', 'Back to your setup'); back.href = 'account.html'; row.appendChild(back);
      }
    });
  }).catch(function(err){ saving.className = 'saving err'; saving.textContent = err.message; });
})();
</script>
</body>
</html>
