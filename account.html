<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your setup · Proud Merchant</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="pm.css">
<link rel="stylesheet" href="intake.css">
<style>
  /* The profile: how far along he is, six steps, one Continue button. */
  body{font-size:16px;line-height:1.45;padding-block:0 60px}
  .narrow{display:grid;gap:14px}
  header.bar{padding-block:14px}
  h1{font-size:clamp(32px,8vw,46px);margin:6px 0 0}
  .bar2{height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
  .bar2 i{display:block;height:100%;background:var(--done);transition:width .4s}
  .steps{display:grid;gap:10px}
  .step{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--todo);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
  .step.ok{border-left-color:var(--done)} .step.wait{border-left-color:var(--brass)} .step.lock{border-left-color:var(--line);color:var(--ink3)}
  .step .n{font-weight:800;font-size:22px;color:var(--brass);font-variant-numeric:tabular-nums}
  .step.lock .n{color:var(--ink3)}
  .step b{display:block;font-size:17px}
  .step small{display:block;color:var(--ink2);font-size:13.5px}
  .step.lock small{color:var(--ink3)}
  .cont{margin-top:4px}
  h3{font-weight:800;font-size:17px;margin:14px 0 0;color:var(--ink2)}
  table{font-size:15px} td{padding:8px 12px 8px 0} td span{font-size:13px;display:inline}
</style>
</head>
<body>
<div class="narrow">
  <header class="bar">
    <a class="brand" href="./"><i></i>Proud Merchant</a>
    <nav class="links" aria-label="Account"><span id="who" style="color:var(--ink3);font-size:14px"></span><a id="teamLink" href="team.html" hidden>Team</a><button class="linkish" id="out" hidden>Log out</button></nav>
  </header>
  <div class="top"><h1 id="title">Your setup</h1><span class="progress" id="progress"></span></div>
  <div class="bar2" id="bar" hidden><i id="fill" style="width:0"></i></div>
  <p class="saving" id="saving"></p>
  <div class="empty" id="empty" hidden></div>
  <div class="steps" id="steps"></div>
  <div class="cont" id="cont"></div>
  <div id="costWrap" hidden>
    <h3>What it costs you</h3>
    <div class="scroll"><table><tbody id="costs"></tbody></table></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="pm.js"></script>
<script src="intake.js"></script>
<script>
(function(){
  var saving = document.getElementById('saving'), empty = document.getElementById('empty'), el = Intake.el;
  PM.session().then(function(s){
    if (!s){ location.replace('login.html'); return; }
    document.getElementById('who').textContent = s.user.email;
    var out = document.getElementById('out'); out.hidden = false;
    out.addEventListener('click', function(){ PM.signOut().then(function(){ location.replace('login.html'); }); });
    PM.rpc('team_overview').then(function(o){ if (o) document.getElementById('teamLink').hidden = false; }).catch(function(){});
    return PM.rpc('get_account').then(function(acct){
      if (!acct){ empty.hidden = false; empty.innerHTML = 'You are logged in as <b></b>, but there is no business on it yet. <a href="./#start">Start one</a>, it takes a minute.'; empty.querySelector('b').textContent = s.user.email; return; }
      build(acct);
    });
  }).catch(function(err){ saving.className = 'saving err'; saving.textContent = err.message; });

  function build(acct){
    document.title = acct.name + ' · Proud Merchant';
    document.getElementById('title').textContent = acct.name;
    var steps = acct.template.steps || [], host = document.getElementById('steps'), first = null, doneSteps = 0;
    steps.forEach(function(st, i){
      var x = Intake.stepState(acct, st);
      var a = el('a', 'step ' + (x.status === 'done' ? 'ok' : x.status === 'pending' ? 'wait' : x.status === 'locked' ? 'lock' : ''));
      a.href = st.review ? 'review.html' : 'step.html?s=' + st.id;
      if (x.status === 'locked'){ a.removeAttribute('href'); }
      a.appendChild(el('span', 'n', String(i + 1)));
      var mid = el('div'); mid.appendChild(el('b', '', st.title));
      mid.appendChild(el('small', '', x.status === 'locked' ? (acct.stage === 'building' ? 'We are building. You get an email when it is ready.' : 'Opens after we build your app.') : (st.hint || '')));
      a.appendChild(mid);
      var chip = el('span', 'chip' + (x.status === 'done' ? ' ok' : x.status === 'pending' ? ' wait' : x.status === 'locked' ? ' lock' : ''),
        x.status === 'done' ? 'Done' : x.status === 'pending' ? 'Pending' : x.status === 'locked' ? 'Not yet' : (st.review ? x.left + ' to check' : x.left + ' left'));
      a.appendChild(chip); host.appendChild(a);
      if (x.status === 'done') doneSteps++;
      if (!first && (x.status === 'todo' || x.status === 'pending')) first = { href: a.href || null, title: st.title, i: i + 1 };
    });
    document.getElementById('progress').textContent = doneSteps + ' of ' + steps.length + ' done';
    document.getElementById('bar').hidden = false; document.getElementById('fill').style.width = Math.round(100 * doneSteps / Math.max(steps.length, 1)) + '%';
    var cont = document.getElementById('cont');
    if (first && first.href){ var b = el('a', 'btn brass', 'Continue: ' + first.i + '. ' + first.title); b.href = first.href; cont.appendChild(b); }
    else if (doneSteps === steps.length) cont.appendChild(el('p', 'sub', 'Everything is done. We take it from here.'));
    document.getElementById('costWrap').hidden = false;
    (acct.template.costs || []).forEach(function(c){
      var tr = el('tr'), td = el('td', '', c[0] + ' '); td.appendChild(el('span', '', '· ' + c[1]));
      tr.appendChild(td); tr.appendChild(el('td', 'r', c[2])); document.getElementById('costs').appendChild(tr);
    });
  }
})();
</script>
</body>
</html>
